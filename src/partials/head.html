<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="robots" content="{{ robots }}">
<meta name="author" content="KAYTHEBOSS">
<link rel="canonical" href="{{ url }}">

<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ url }}">
<meta property="og:type" content="{{ ogType }}">
<meta property="og:image" content="{{ ogImage }}">
<meta property="og:image:alt" content="{{ ogImageAlt }}">
{{#if published}}<meta property="article:published_time" content="{{ published }}">
{{/if}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ ogImage }}">
<meta name="theme-color" content="#08080a">

<link rel="icon" href="/assets/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Hanken+Grotesk:ital,wght@0,300..700;1,300..700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/css/app.css">
{{{ jsonLd }}}
